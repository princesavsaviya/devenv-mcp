[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devenv-mcp"
version = "0.1.0"
description = "Diagnostic MCP server that correlates process, port, Docker, and log signals into structured root-cause reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "psutil",
    "docker",
    "fastmcp",
]

[project.scripts]
devenv-mcp = "devenv_mcp.server:main"